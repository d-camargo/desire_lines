site_name: Desire Lines
site_url: https://desirelines.dcamargo.com.br
repo_url: https://github.com/d-camargo/desire_lines
docs_dir: docs
exclude_docs: topicos/

theme:
  name: material
  language: pt-BR
  logo: assets/logo.png
  favicon: assets/logo.png

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: pt
          name: Português (Brasil)
          default: true
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Início: Home
            Instalação: Installation
            Guias: Guides
            Matriz OD: OD Matrix
            Linhas de desejo: Desire lines
            AoN Delaunay: AoN (Delaunay)
            Alocação em rodovias: Highway assignment
            Exemplos: Examples
            Referência: Reference
            Formatos de entrada: Input formats
            Campos de saída: Output fields
            Parâmetros HCM: HCM parameters
            Métodos: Methods
            Solução de problemas: Troubleshooting
            Arquitetura: Architecture
            Histórico de versões: Changelog
      fallback_to_default: true

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Início: index.md
  - Instalação: instalacao.md
  - Guias:
      - Matriz OD: guias/matriz-od.md
      - Linhas de desejo: guias/linhas-de-desejo.md
      - AoN Delaunay: guias/aon-delaunay.md
      - Alocação em rodovias: guias/alocacao-rodovias.md
      - Exemplos: guias/exemplos.md
  - Referência:
      - Formatos de entrada: referencia/formatos-de-entrada.md
      - Campos de saída: referencia/campos-de-saida.md
      - Parâmetros HCM: referencia/parametros-hcm.md
      - Métodos: referencia/metodos.md
  - Solução de problemas: solucao-de-problemas.md
  - Arquitetura: arquitetura.md
  - Histórico de versões: changelog.md

extra_css:
  - stylesheets/extra.css
